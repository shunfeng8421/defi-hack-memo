name: 'DeFi Security Scanner'
description: 'Scan Solidity contracts for 50 DeFi attack patterns — 824 real-world incidents backed'
author: 'Shiqiang Chen'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Directory to scan (default: repo root)'
    required: false
    default: '.'
  fail_on_critical:
    description: 'Fail workflow if CRITICAL findings found'
    required: false
    default: 'false'

outputs:
  findings:
    description: 'Total number of CRITICAL + HIGH findings'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      shell: bash
      run: pip install --quiet fpdf2 2>/dev/null || true

    - name: Run DeFi Scanner
      id: scan
      shell: bash
      continue-on-error: true
      run: |
        python ${{ github.action_path }}/defi_scanner.py ${{ inputs.path }} > scan-report.md 2>&1 || true
        findings=$(grep -c '🔴\|🟠' scan-report.md 2>/dev/null || echo "0")
        echo "findings=$findings" >> $GITHUB_OUTPUT
        cat scan-report.md >> $GITHUB_STEP_SUMMARY

    - name: Fail on Critical
      if: inputs.fail_on_critical == 'true' && steps.scan.outputs.findings > '0'
      shell: bash
      run: |
        echo "⚠️ Found ${{ steps.scan.outputs.findings }} critical/high issues"
        exit 1
