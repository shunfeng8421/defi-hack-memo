name: "🔍 DeFi Security Scan"

on:
  pull_request:
    paths:
      - "contracts/**"
      - "src/**"
      - "**.sol"
      - "**.rs"
  push:
    branches: [main, master]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shunfeng8421/defi-hack-memo/github-action@master
        with:
          path: .
          fail_on: CRITICAL
