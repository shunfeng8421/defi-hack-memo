name: DeFi Security Scanner

on:
  pull_request:
    paths:
      - '**/*.sol'
  push:
    paths:
      - '**/*.sol'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          pip install --quiet fpdf2 2>/dev/null || echo "fpdf2 skipped (PDF generation only)"
          echo "Python: $(python --version)"
      
      - name: Run DeFi Scanner
        id: scan
        continue-on-error: true
        run: |
          python defi_scanner.py . > scan-report.md 2>&1 || true
          findings=$(grep -c '🔴\|🟠' scan-report.md 2>/dev/null || echo "0")
          echo "findings=$findings" >> $GITHUB_OUTPUT
          cat scan-report.md >> $GITHUB_STEP_SUMMARY
      
      - name: Post Results
        if: always()
        uses: actions/github-script@v7
        env:
          SCAN_REPORT: ${{ steps.scan.outputs.findings || '0' }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('scan-report.md', 'utf8');
            const criticals = (report.match(/🔴/g) || []).length;
            const highs = (report.match(/🟠/g) || []).length;
            
            let body = `## 🔒 DeFi Security Scan Results\n\n`;
            body += `| Severity | Count |\n|:--|:--:|\n`;
            body += `| 🔴 CRITICAL | ${criticals} |\n`;
            body += `| 🟠 HIGH | ${highs} |\n\n`;
            
            if (criticals === 0 && highs === 0) {
              body += `✅ **No critical/high issues found**\n\n`;
            } else {
              body += `⚠️ Found ${criticals + highs} issues. See details below.\n\n`;
            }
            
            body += `<details><summary>Full Report</summary>\n\n\`\`\`\n${report.substring(0, 5000)}\n\`\`\`\n</details>`;
            body += `\n\n---\n*Scanned by DeFi Scanner — 50-pattern attack taxonomy*`;
            
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
