name: DeFi Security Scanner

on:
  pull_request:
    paths:
      - '**/*.sol'
  push:
    paths:
      - '**/*.sol'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          pip install --quiet fpdf2 2>/dev/null || echo "fpdf2 skipped (PDF generation only)"
          echo "Python: $(python --version)"
      
      - name: Run DeFi Scanner
        id: scan
        continue-on-error: true
        run: |
          python defi_scanner.py . > scan-report.md 2>&1 || true
          findings=$(grep -c '🔴\|🟠' scan-report.md 2>/dev/null || echo "0")
          echo "findings=$findings" >> $GITHUB_OUTPUT
          cat scan-report.md >> $GITHUB_STEP_SUMMARY
      
      - name: Post Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=$(cat scan-report.md)
          CRITICALS=$(echo "$REPORT" | grep -c '🔴' || echo "0")
          HIGHS=$(echo "$REPORT" | grep -c '🟠' || echo "0")
          
          {
            echo "## 🔒 DeFi Security Scan Results"
            echo ""
            echo "| Severity | Count |"
            echo "|:--|:--:|"
            echo "| 🔴 CRITICAL | ${CRITICALS} |"
            echo "| 🟠 HIGH | ${HIGHS} |"
            echo ""
            if [ "${CRITICALS}" = "0" ] && [ "${HIGHS}" = "0" ]; then
              echo "✅ **No critical/high issues found**"
            else
              echo "⚠️ Found $((CRITICALS + HIGHS)) issues. See details below."
            fi
            echo ""
            echo "<details><summary>Full Report</summary>"
            echo ""
            echo '```'
            echo "$REPORT" | head -c 5000
            echo '```'
            echo "</details>"
            echo ""
            echo "---"
            echo "*Scanned by DeFi Scanner — 50-pattern attack taxonomy*"
          } > scan-comment.md
          
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file scan-comment.md
          fi
