        <div class="pattern ${p.s}" id="p${i}">

function filter(sev) {
    document.querySelectorAll('.stats span').forEach(s => s.classList.remove('active'));

function search() {
    const q = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.pattern').forEach(p => {

}
